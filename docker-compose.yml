version: '3.8'

services:
  # PostgreSQL Database for Microservices (Users & Video Metadata)
  postgres:
    image: postgres:16-alpine
    container_name: youtube_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-youtube_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-youtube_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # User Management Microservice (NestJS)
  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: youtube_user_service
    restart: always
    ports:
      - "${USER_SERVICE_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-youtube_db}
    volumes:
      - ./apps/user-service:/app
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy

  # Authentication Microservice (NestJS)
  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    container_name: youtube_auth_service
    restart: always
    ports:
      - "${AUTH_SERVICE_PORT:-3002}:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_youtube_platform_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      USER_SERVICE_URL: http://user-service:3001
    volumes:
      - ./apps/auth-service:/app
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      - user-service

volumes:
  postgres_data:
